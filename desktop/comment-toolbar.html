<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; form-action 'none'"><title>生长 · 评论采集</title><link rel="stylesheet" href="comment-toolbar.css"></head><body>
<header><div><span class="eyebrow">生长 STUDIO / 评论采集</span><h1 id="heading">先登录，再一键采集</h1></div><div class="count"><strong id="count">0</strong><span id="target">/ 200 条</span></div></header>
<div class="actions"><button id="start" class="primary">开始自动采集</button><button id="pause" disabled>暂停</button><button id="read">只读当前页</button><button id="metrics">读取作品数据</button><button id="finish" disabled>返回预览</button><div class="spacer"></div><label><input type="checkbox" id="replies">包含回复</label><select id="limit" aria-label="本次采集数量"><option value="50">最多 50 条</option><option value="200" selected>最多 200 条</option><option value="1000">最多 1,000 条</option></select><button id="selected" class="quiet">读取选中文字</button><button id="reload" class="quiet">刷新网页</button></div>
<div class="status"><span class="dot" id="dot"></span><p id="message" role="status" aria-live="polite">在下方官方页面登录、打开评论区，然后点击“开始自动采集”。</p><span id="rounds">尚未开始</span></div>
<div class="track"><div id="progress"></div></div><p class="note">作品指标 + 结构化评论 + 页面补充 · 自动滚动并分批暂存 · 达到上限或无新增时暂停 · 不代表全部评论 · 登录与验证请自行完成</p>
<script src="comment-toolbar.js"></script></body></html>
